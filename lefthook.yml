# Formats the staged files, then runs the checks for the part that changed.
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: python
      glob: ["{backend,agent,tests,bench}/**/*.py", "*.py", "*.toml", ".env.defaults", "postman/**", "dashboard/src/api.ts"]
      group:
        piped: true
        jobs:
          - run: uv run ruff format
            stage_fixed: true
          - run: npm run check:python

    - name: typescript
      glob: ["{dashboard,e2e}/**", "*.config.*", ".env.defaults"]
      group:
        piped: true
        jobs:
          - run: npx prettier --write -u {staged_files}
            stage_fixed: true
          - run: npm run check:ts
