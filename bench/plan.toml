# The model comparison: each trial runs one model on a set of claims, `all` 25
# in the queue or the five `tiny` ones, a number of times, each from a fresh
# database. Models are specs from models.toml. Trials run in this order: the
# hosted models first, as they are quick, then the local ones.

# What a claim is expected to use, for the cost estimate that BENCH_BUDGET_USD
# guards: one Claude Haiku 5.5 claim, measured on October 21, 2026
[estimate]
input_tokens_per_claim = 63000
output_tokens_per_claim = 3400

[[trials]]
model = "anthropic:claude-haiku-5-5"
claims = "all"
repeats = 3

# About $0.32 a claim, so only the tiny claims
[[trials]]
model = "anthropic:claude-opus-5-5"
claims = "tiny"
repeats = 3

# Free, but OpenRouter allows a free account about 50 requests a day
[[trials]]
model = "openrouter:google/gemma-4-31b-it:free"
claims = "tiny"
repeats = 1

[[trials]]
model = "ollama:qwen3.5:4b"
claims = "all"
repeats = 3

[[trials]]
model = "ollama:qwen3.5:9b"
claims = "all"
repeats = 3
