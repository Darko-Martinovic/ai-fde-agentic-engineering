# The models the agent may run on, chosen by MODEL_NAME or in the dashboard.
# `spec` is provider:model. Prices are US dollars per million tokens. OpenRouter
# reports each call's cost, which the agent records; for the other providers it
# works the cost out from these prices. `options` go to the model's LangChain
# class.

[[models]]
spec = "openrouter:openai/gpt-6-luna"
label = "GPT-6 Luna"
input_price = 0.10
output_price = 0.50
# A reply is capped, as the Anthropic models' are: in a live evaluation one
# ran to 65,536 tokens and took over seven minutes
options = { reasoning_effort = "low", max_tokens = 16000 }

